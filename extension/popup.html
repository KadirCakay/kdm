<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --text:#1d2330; --muted:#6b7280; --border:#e3e6eb; --accent:#2563eb; --hover:#f0f3f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1f26; --text:#e6e8ec; --muted:#9aa1ad; --border:#2c313b; --hover:#232731; } }
  body { margin:0; width:420px; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
  header b { font-size:15px; } header b span { color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:#9ca3af; display:inline-block; }
  .dot.on { background:#16a34a; } .dot.off { background:#dc2626; }
  .spacer { flex:1; }
  button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { background:var(--hover); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .section { padding:8px 12px; }
  .title { font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; margin:4px 0 6px; }
  .item { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); }
  .item:last-child { border-bottom:0; }
  .item .u { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--accent); color:var(--accent); flex-shrink:0; }
  .badge.sub { border-color:#16a34a; color:#16a34a; }
  .muted { color:var(--muted); }
  .empty { color:var(--muted); padding:10px 0; }
  .list { max-height:300px; overflow:auto; }
  details { padding:6px 12px 10px; border-top:1px solid var(--border); }
  summary { cursor:pointer; color:var(--muted); }
  label { display:flex; gap:6px; align-items:center; margin-top:6px; }
  input[type=number] { width:80px; font:inherit; padding:2px 4px; }
  .warn { background:#fef3c7; color:#92400e; padding:8px 12px; display:none; }
  @media (prefers-color-scheme: dark) { .warn { background:#3b2f13; color:#fcd34d; } }
</style>
</head>
<body>
<header>
  <b><span>K</span>DM</b><span class="dot" id="dot"></span><span class="muted" id="status">kontrol ediliyor…</span>
  <span class="spacer"></span>
  <button id="openApp">Uygulamayı aç</button>
</header>
<div class="warn" id="warn">KDM uygulaması çalışmıyor. Bilgisayarınızda <code>python run.py</code> ile başlatın.</div>
<div class="section">
  <button class="primary" id="sendPage" style="width:100%">⬇ Bu sayfadaki videoyu indir</button>
</div>
<div class="section">
  <div class="title">Yakalanan medya</div>
  <div class="list" id="media"></div>
  <div class="title" style="margin-top:10px">Yakalanan altyazılar</div>
  <div class="list" id="subs"></div>
  <div style="margin-top:8px; display:flex; gap:6px">
    <button id="clear">Listeyi temizle</button>
    <span class="muted" style="align-self:center">Videoyu oynatın; akışlar burada belirir.</span>
  </div>
</div>
<details>
  <summary>Ayarlar</summary>
  <label>Uygulama portu <input type="number" id="port" min="1" max="65535"></label>
  <label><input type="checkbox" id="overlay"> Videoların üzerinde “İndir” düğmesi göster</label>
  <label><input type="checkbox" id="catchDownloads"> Tarayıcı indirmelerini KDM'ye yönlendir</label>
  <label>…en az <input type="number" id="minCatchMB" min="0"> MB olanları</label>
</details>
<script src="popup.js"></script>
</body>
</html>
